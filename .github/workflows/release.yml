name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install Qt rcc
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev-tools
      - name: Test
        run: make test
      - name: Build
        run: make all RCC=/usr/lib/qt6/libexec/rcc VERSION=${GITHUB_REF_NAME#v}
      - name: Checksums
        run: cd dist && sha512sum *.tar.gz | tee SHA512SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rm-onleihe
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rm-onleihe-aarch64.tar.gz
            dist/rm-onleihe-armv7.tar.gz
            dist/SHA512SUMS
